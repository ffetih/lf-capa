apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-guide
  labels:
    app.kubernetes.io/name: dev-guide
    app.kubernetes.io/part-of: settlement-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dev-guide
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dev-guide
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: nginx
          image: localhost/settlement/dev-guide:0.1.0   # loaded into kind, never pulled
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { memory: 64Mi }
