# Single-node kind cluster for the CAPA lab.
# Port 30443 -> Argo CD UI (NodePort), 30080 -> payment-api (later), 30746 -> Argo Workflows UI (later)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: capa
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: 30443
        listenAddress: "127.0.0.1"
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "127.0.0.1"
      - containerPort: 30746
        hostPort: 30746
        listenAddress: "127.0.0.1"
